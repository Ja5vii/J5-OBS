<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>J5 OBS VNC</title>
    <style>
        body { margin: 0; background-color: #0f172a; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; color: white; }
        #top_bar { background-color: #1e293b; padding: 10px; text-align: center; font-weight: bold; }
        #screen { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
    <!-- Load noVNC from CDN -->
    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const instId = params.get('id');
            if (!instId) {
                document.getElementById('top_bar').innerText = 'No instance ID provided';
                return;
            }
            
            document.getElementById('top_bar').innerText = 'Connecting to ' + instId + '...';
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/api/instances/' + instId + '/vnc';
            
            const rfb = new RFB(document.getElementById('screen'), wsUrl, {
                wsProtocols: ['binary']
            });
            
            rfb.addEventListener('connect', () => {
                document.getElementById('top_bar').innerText = 'Connected to ' + instId;
            });
            
            rfb.addEventListener('disconnect', (e) => {
                document.getElementById('top_bar').innerText = 'Disconnected: ' + (e.detail.clean ? 'Clean' : 'Error');
            });
            
            rfb.scaleViewport = true;
            rfb.resizeSession = true;
        });
    </script>
</head>
<body>
    <div id="top_bar">Initializing...</div>
    <div id="screen"></div>
</body>
</html>
