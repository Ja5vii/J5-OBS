load_module modules/ngx_rtmp_module.so;
worker_processes auto;
daemon off;
pid /home/container/j5-obs/nginx.pid;
error_log /home/container/j5-obs/logs/nginx-error.log;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }
    }
}
